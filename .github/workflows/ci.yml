name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Engine tests and package
        run: ./gradlew build
      - name: Install
        run: npm ci
      - name: Web tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Install and probe packaged local agent tools
        run: node server/test/package-smoke.mjs
      - name: Install browser for site checks
        run: npx playwright install --with-deps chrome
      - name: Built site checks
        run: npm run test:e2e -w web
      - name: Build MCP container
        run: docker build -f server/Dockerfile -t material-shape-studio-mcp .
      - name: Probe MCP container
        run: node server/test/container-smoke.mjs
